name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oseq
          POSTGRES_PASSWORD: oseq
          POSTGRES_DB: opensequence_test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U oseq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The Redis queue's conformance tests skip without REDIS_URL; run them here.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEQ_TEST_DB_DSN: postgres://oseq:oseq@127.0.0.1:54329/opensequence_test
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: OpenAPI file matches the routes
        run: |
          pnpm --filter @opensequence/server openapi
          git diff --exit-code -- apps/server/openapi.json || { echo "apps/server/openapi.json is stale: run 'pnpm --filter @opensequence/server openapi' and commit it."; exit 1; }

  image:
    # Pull requests only build the image. A push to main publishes :main and :sha-<commit>; a v*
    # tag publishes :<version>, :<major>.<minor> and :latest, for amd64 and arm64.
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: ghcr.io/${{ github.repository }}
            file: apps/server/Dockerfile
            title: OpenSequence server
          - name: mcp
            image: ghcr.io/${{ github.repository }}-mcp
            file: packages/mcp/Dockerfile
            title: OpenSequence MCP server
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Open source, self-hosted sales sequencing: email, SMS and call sequences over an API.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.url=https://opensequence.dev
            org.opencontainers.image.documentation=https://docs.opensequence.dev
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          # arm64 is built under emulation and is slow, so only releases carry it.
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes \
            --notes "Images: \`ghcr.io/${{ github.repository }}:${TAG#v}\` and \`ghcr.io/${{ github.repository }}-mcp:${TAG#v}\`"
