name: Publish SDK

# Publishes @opensequence/sdk to npm on a release tag, with provenance. Inert until the repository
# has an NPM_TOKEN secret: without it the job explains and exits green, so a release is never
# blocked by it. Nothing in ci.yml depends on this workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish-sdk:
    name: Publish @opensequence/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check for the npm token
        id: token
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping the publish. Add the secret to publish @opensequence/sdk on the next tag."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.present == 'true'
      - name: Build the SDK
        if: steps.token.outputs.present == 'true'
        run: pnpm --filter @opensequence/sdk run build
      - run: pnpm --filter @opensequence/sdk test
        if: steps.token.outputs.present == 'true'
      - name: Skip if this version is already on npm
        id: version
        if: steps.token.outputs.present == 'true'
        working-directory: packages/sdk
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@opensequence/sdk@$version" version >/dev/null 2>&1; then
            echo "@opensequence/sdk@$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.token.outputs.present == 'true' && steps.version.outputs.publish == 'true'
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
